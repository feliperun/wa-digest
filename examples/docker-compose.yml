services:
  wa-digest:
    image: ghcr.io/feliperun/wa-digest:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3897:3897"
    environment:
      PORT: "3897"
      DIGEST_API_TOKEN: "${DIGEST_API_TOKEN}"
      EVOLUTION_BASE_URL: "${EVOLUTION_BASE_URL:-http://evolution-api:8080}"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY}"
      EVOLUTION_INSTANCE: "${EVOLUTION_INSTANCE:-monitor}"
      DATABASE_URL: "${DATABASE_URL}"
      MEDIA_STORAGE_DIR: "/data"
      TRANSCRIBER_PROVIDER: "${TRANSCRIBER_PROVIDER:-soniox}"
      SONIOX_API_KEY: "${SONIOX_API_KEY}"
      SONIOX_MODEL: "${SONIOX_MODEL:-stt-async-v4}"
      MAX_CONCURRENT_TRANSCRIPTIONS: "${MAX_CONCURRENT_TRANSCRIPTIONS:-2}"
      MAX_TRANSCRIPTION_MEDIA_BYTES: "${MAX_TRANSCRIPTION_MEDIA_BYTES:-26214400}"
      MEDIA_DOWNLOAD_TIMEOUT_MS: "${MEDIA_DOWNLOAD_TIMEOUT_MS:-30000}"
      TRANSCRIPTION_ALLOWED_MIME_TYPES: "${TRANSCRIPTION_ALLOWED_MIME_TYPES:-audio/*,video/*}"
      MAX_TRANSCRIPTION_MINUTES_PER_DAY: "${MAX_TRANSCRIPTION_MINUTES_PER_DAY:-0}"
      VISION_PROVIDER: "${VISION_PROVIDER:-metadata}"
      VISION_BASE_URL: "${VISION_BASE_URL:-}"
      VISION_API_KEY: "${VISION_API_KEY:-}"
      VISION_MODEL: "${VISION_MODEL:-gpt-4.1-mini}"
      OPENCLAW_COMPAT: "true"
    volumes:
      - wa_digest_data:/data

  wa-digest-worker:
    image: ghcr.io/feliperun/wa-digest:latest
    restart: unless-stopped
    command: ["node", "dist/cli.js", "worker"]
    environment:
      DIGEST_API_TOKEN: "${DIGEST_API_TOKEN}"
      EVOLUTION_BASE_URL: "${EVOLUTION_BASE_URL:-http://evolution-api:8080}"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY}"
      EVOLUTION_INSTANCE: "${EVOLUTION_INSTANCE:-monitor}"
      DATABASE_URL: "${DATABASE_URL}"
      MEDIA_STORAGE_DIR: "/data"
      TRANSCRIBER_PROVIDER: "${TRANSCRIBER_PROVIDER:-soniox}"
      SONIOX_API_KEY: "${SONIOX_API_KEY}"
      SONIOX_MODEL: "${SONIOX_MODEL:-stt-async-v4}"
      MAX_CONCURRENT_TRANSCRIPTIONS: "${MAX_CONCURRENT_TRANSCRIPTIONS:-2}"
      MAX_TRANSCRIPTION_MEDIA_BYTES: "${MAX_TRANSCRIPTION_MEDIA_BYTES:-26214400}"
      MEDIA_DOWNLOAD_TIMEOUT_MS: "${MEDIA_DOWNLOAD_TIMEOUT_MS:-30000}"
      TRANSCRIPTION_ALLOWED_MIME_TYPES: "${TRANSCRIPTION_ALLOWED_MIME_TYPES:-audio/*,video/*}"
      MAX_TRANSCRIPTION_MINUTES_PER_DAY: "${MAX_TRANSCRIPTION_MINUTES_PER_DAY:-0}"
      OPENCLAW_COMPAT: "true"
    volumes:
      - wa_digest_data:/data

  wa-digest-migrate:
    image: ghcr.io/feliperun/wa-digest:latest
    restart: "no"
    command: ["node", "dist/cli.js", "migrate"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: "${DATABASE_URL}"
    volumes:
      - wa_digest_data:/data

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    command: --interval 3600 --cleanup wa-digest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  wa_digest_data:
