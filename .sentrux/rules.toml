[constraints]
max_cycles = 0
max_coupling = "B"
max_cc = 25
no_god_files = true

[[layers]]
name = "core"
paths = [
  "src/types.ts",
  "src/utils.ts",
  "src/config.ts"
]
order = 2

[[layers]]
name = "providers"
paths = [
  "src/evolution/*",
  "src/media/*",
  "src/store/*",
  "src/transcription/*"
]
order = 1

[[layers]]
name = "application"
paths = [
  "src/server.ts",
  "src/cli.ts",
  "src/index.ts",
  "src/digest/*"
]
order = 0
